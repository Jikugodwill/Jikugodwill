<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc">

  <title id="title">Godwill Nsanwi Jiku — Systems Architect, Technical Founder, AI &amp; Web3 Engineer</title>
  <desc id="desc">
    Futuristic engineering profile banner for Godwill Nsanwi Jiku, founder of KwadRise Labs,
    focused on software architecture, AI, Web3 and product systems.
  </desc>

  <defs>
    <!-- Core surface -->
    <linearGradient id="shell" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B16"/>
      <stop offset="0.48" stop-color="#0D1224"/>
      <stop offset="1" stop-color="#09151A"/>
    </linearGradient>

    <!-- Signature Godwill palette -->
    <linearGradient id="edge" x1="50" y1="20" x2="1150" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6B84A"/>
      <stop offset="0.46" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#56E0B5"/>
    </linearGradient>

    <linearGradient id="nameLine" x1="68" y1="0" x2="524" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6B84A"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#56E0B5"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(990 174) rotate(90) scale(180)">
      <stop stop-color="#8B5CF6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
        stroke="#A78BFA"
        stroke-opacity=".045"
        stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="screen">
      <rect x="52" y="68" width="1096" height="250"/>
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .scan {
      animation: scan 6.5s linear infinite;
    }

    .pulse {
      animation: pulse 2.2s ease-in-out infinite;
      transform-origin: center;
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    .role-1 {
      animation: role1 10.5s ease-in-out infinite;
    }

    .role-2 {
      opacity: 0;
      animation: role2 10.5s ease-in-out infinite;
    }

    .role-3 {
      opacity: 0;
      animation: role3 10.5s ease-in-out infinite;
    }

    .node-a {
      animation: nodeA 7s ease-in-out infinite;
    }

    .node-b {
      animation: nodeB 8s ease-in-out infinite;
    }

    .node-c {
      animation: nodeC 6.5s ease-in-out infinite;
    }

    .signal {
      stroke-dasharray: 5 11;
      animation: signal 7s linear infinite;
    }

    @keyframes scan {
      from { transform: translateX(-430px); }
      to   { transform: translateX(1550px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .38; }
      50%      { opacity: 1; }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes role1 {
      0%, 27% {
        opacity: 1;
        transform: translateY(0);
      }
      31%, 96% {
        opacity: 0;
        transform: translateY(-8px);
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes role2 {
      0%, 30% {
        opacity: 0;
        transform: translateY(8px);
      }
      34%, 60% {
        opacity: 1;
        transform: translateY(0);
      }
      64%, 100% {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    @keyframes role3 {
      0%, 63% {
        opacity: 0;
        transform: translateY(8px);
      }
      67%, 93% {
        opacity: 1;
        transform: translateY(0);
      }
      97%, 100% {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    @keyframes nodeA {
      0%, 100% {
        transform: translate(0, 0);
        opacity: .35;
      }
      50% {
        transform: translate(18px, -10px);
        opacity: 1;
      }
    }

    @keyframes nodeB {
      0%, 100% {
        transform: translate(0, 0);
        opacity: .9;
      }
      50% {
        transform: translate(-16px, 12px);
        opacity: .3;
      }
    }

    @keyframes nodeC {
      0%, 100% {
        transform: translate(0, 0);
        opacity: .45;
      }
      50% {
        transform: translate(8px, 16px);
        opacity: .95;
      }
    }

    @keyframes signal {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -160; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan,
      .pulse,
      .cursor,
      .role-1,
      .role-2,
      .role-3,
      .node-a,
      .node-b,
      .node-c,
      .signal {
        animation: none;
      }

      .role-2,
      .role-3 {
        display: none;
      }
    }
  </style>

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="358"
    rx="22"
    fill="url(#shell)"
    stroke="url(#edge)"
    stroke-width="2"
  />

  <rect
    x="18"
    y="18"
    width="1164"
    height="324"
    rx="15"
    fill="url(#grid)"
  />

  <rect
    x="810"
    y="58"
    width="360"
    height="276"
    fill="url(#ambient)"
  />

  <!-- Window chrome -->
  <path d="M1 58H1199" stroke="#242B43"/>

  <circle cx="28" cy="30" r="6" fill="#F87171"/>
  <circle cx="50" cy="30" r="6" fill="#F6B84A"/>
  <circle cx="72" cy="30" r="6" fill="#56E0B5"/>

  <text
    x="600"
    y="35"
    text-anchor="middle"
    class="mono"
    font-size="12"
    letter-spacing="2.4"
    fill="#69738F">
    GODWILL.SYSTEMS // PROFILE
  </text>

  <!-- Moving scanner -->
  <g clip-path="url(#screen)">
    <rect
      class="scan"
      x="-430"
      y="58"
      width="430"
      height="270"
      fill="url(#scan)"
    />
  </g>

  <!-- Abstract architecture graph -->
  <g opacity=".72">
    <path
      class="signal"
      d="M889 103H1007L1042 138H1120"
      stroke="#A78BFA"
      stroke-width="1.2"
    />

    <path
      d="M938 262H1018L1055 225H1127"
      stroke="#56E0B5"
      stroke-width="1.2"
    />

    <path
      d="M1010 138V225"
      stroke="#F6B84A"
      stroke-opacity=".45"
      stroke-width="1"
    />

    <circle
      class="node-a"
      cx="1042"
      cy="138"
      r="4"
      fill="#A78BFA"
      filter="url(#glow)"
    />

    <circle
      class="node-b"
      cx="1055"
      cy="225"
      r="4"
      fill="#56E0B5"
      filter="url(#glow)"
    />

    <circle
      class="node-c"
      cx="1010"
      cy="181"
      r="3.5"
      fill="#F6B84A"
      filter="url(#glow)"
    />
  </g>

  <!-- Terminal prompt -->
  <text x="70" y="100" class="mono" font-size="16"><tspan fill="#56E0B5">godwill@kwadrise</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#A78BFA">~/systems</tspan><tspan fill="#E2E8F0">&#160;$ whoami</tspan></text>

  <!-- Identity -->
  <text
    x="68"
    y="164"
    class="mono"
    font-size="38"
    font-weight="700"
    letter-spacing=".8"
    fill="#F8FAFC">
    GODWILL NSANWI JIKU
  </text>

  <rect
    x="68"
    y="178"
    width="456"
    height="3"
    rx="1.5"
    fill="url(#nameLine)"
  />

  <!-- Rotating roles -->
  <g
    class="mono"
    font-size="20"
    font-weight="500">

    <g class="role-1">
      <text x="70" y="221" fill="#C4B5FD">Systems Architect</text>
      <rect class="cursor" x="284" y="202" width="10" height="24" rx="1" fill="#F6B84A"/>
    </g>
    <g class="role-2">
      <text x="70" y="221" fill="#F6C96B">Founder · KwadRise Labs</text>
      <rect class="cursor" x="344" y="202" width="10" height="24" rx="1" fill="#F6B84A"/>
    </g>
    <g class="role-3">
      <text x="70" y="221" fill="#7BE8C6">Frontend · AI · Web3</text>
      <rect class="cursor" x="308" y="202" width="10" height="24" rx="1" fill="#F6B84A"/>
    </g>

  </g>

  <!-- Positioning -->
  <text
    x="70"
    y="267"
    class="mono"
    font-size="15.5"
    fill="#94A3B8">
    Helping startups ship scalable product systems.
  </text>

  <!-- Availability/status -->
  <g transform="translate(70 294)">
    <circle
      class="pulse"
      cx="6"
      cy="6"
      r="5.5"
      fill="#56E0B5"
      filter="url(#glow)"
    />

    <text
      x="22"
      y="11"
      class="mono"
      font-size="13"
      letter-spacing="1.2"
      fill="#8CEACD">
      BUILDING · LEADING · SHIPPING
    </text>
  </g>

  <!-- Right status module -->
  <g transform="translate(903 150)" class="mono">
    <rect
      width="222"
      height="91"
      rx="12"
      fill="#080E1B"
      fill-opacity=".88"
      stroke="#302958"
    />

    <text
      x="18"
      y="25"
      font-size="10"
      letter-spacing="1.5"
      fill="#69738F">
      CURRENT VECTOR
    </text>

    <circle
      class="pulse"
      cx="21"
      cy="48"
      r="4"
      fill="#F6B84A"
    />

    <text
      x="34"
      y="53"
      font-size="13"
      fill="#F8FAFC">
      product systems
    </text>

    <text
      x="18"
      y="75"
      font-size="11"
      fill="#777F97">
      AI · WEB3 · FRONTEND
    </text>
  </g>

  <!-- Tiny system labels -->
  <g class="mono" font-size="9" letter-spacing="1.3" fill="#4E5870">
    <text x="934" y="115">ARCHITECTURE</text>
    <text x="1046" y="249">EXECUTION</text>
    <text x="903" y="281">SYSTEMS</text>
  </g>
</svg>

